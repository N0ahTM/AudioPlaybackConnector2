name: Build

on:
  workflow_dispatch:
    inputs:
      upload_failure_binlog:
        description: 'Upload unsigned build failure diagnostics for 1 day (may contain paths/environment)'
        type: boolean
        default: false
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Review dependency changes
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: low
        fail-on-scopes: runtime, development, unknown
        license-check: false
        comment-summary-in-pr: never

  headless:
    name: Headless (${{ matrix.platform }}, PCH disabled=${{ matrix.disable_pch }})
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            disable_pch: false
          - platform: ARM64
            disable_pch: false
          - platform: x64
            disable_pch: true
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
    - name: Restore, build and test without the UI project
      shell: pwsh
      env:
        HEADLESS_PLATFORM: ${{ matrix.platform }}
        DISABLE_PCH: ${{ matrix.disable_pch }}
      run: |
        ./scripts/build-headless.ps1 -Platform $env:HEADLESS_PLATFORM -DisablePrecompiledHeaders:($env:DISABLE_PCH -eq 'true')
    - name: Repeat native race scenarios with a watchdog
      if: ${{ matrix.platform == 'x64' && !matrix.disable_pch }}
      shell: pwsh
      run: |
        ./scripts/test/run-concurrency-stress.ps1 -Iterations 5 -Seed 314159 -TotalTimeoutSeconds 180 -OutputDirectory '${{ runner.temp }}/concurrency'
    - name: Upload failed stress diagnostics
      if: ${{ failure() && matrix.platform == 'x64' && !matrix.disable_pch }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: concurrency-diagnostics
        path: ${{ runner.temp }}/concurrency
        if-no-files-found: ignore
        retention-days: 7

    - name: Install the pinned clang-tidy toolchain
      if: ${{ matrix.platform == 'x64' && !matrix.disable_pch }}
      shell: pwsh
      run: choco install llvm --version=22.1.7 -y --no-progress

    - name: Analyze CoreRuntime with clang-tidy
      if: ${{ matrix.platform == 'x64' && !matrix.disable_pch }}
      shell: pwsh
      run: ./scripts/run-clang-tidy.ps1 -ToolPath 'C:/Program Files/LLVM/bin/clang-tidy.exe' -LogPath "$env:RUNNER_TEMP/clang-tidy-core.log"

  quality:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Validate documentation and localizations
      shell: pwsh
      run: |
        ./scripts/validate-localizations.ps1
        ./scripts/test-localizations.ps1
        ./scripts/validate-markdown-links.ps1
        ./scripts/update-cli-reference.ps1 -Check
        ./scripts/test-release-metadata.ps1
        ./scripts/test-store-tag-notes.ps1
        ./scripts/test-release-version.ps1
        ./scripts/test-release-promotion.ps1
        ./scripts/test-build-attestations.ps1
        python scripts/test-sbom.py
        if ($LASTEXITCODE -ne 0) { throw "SBOM gate tests failed." }
        python scripts/test-dependency-vulnerabilities.py
        if ($LASTEXITCODE -ne 0) { throw "Dependency vulnerability gate tests failed." }
        python scripts/test-dependency-licenses.py
        if ($LASTEXITCODE -ne 0) { throw "Dependency license gate tests failed." }
        ./scripts/test-package-notices.ps1

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Verify MSBuild version derivation
      shell: pwsh
      run: ./scripts/test-build-version.ps1

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          packages
          .nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config', '**/*.vcxproj', '**/*.wapproj', 'Directory.Build.props', 'AudioPlaybackConnector2.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install static analysis tools
      shell: pwsh
      run: |
        choco install llvm --version=22.1.7 -y --no-progress
        choco install cppcheck --version=2.19.0 -y --no-progress
        'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        'C:\Program Files\Cppcheck' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Check formatting
      shell: pwsh
      run: |
        $files = git ls-files '*.cpp' '*.h' '*.hpp' '*.cxx' '*.cc' '*.ixx'
        clang-format --dry-run --Werror $files

    - name: Run CppCheck
      shell: pwsh
      run: |
        $files = git ls-files 'AudioPlaybackConnector2/src/*.cpp' 'AudioPlaybackConnector2/ui/*.cpp'
        cppcheck `
          --enable=warning,performance,portability `
          --std=c++20 `
          --language=c++ `
          --platform=win64 `
          --inline-suppr `
          -IAudioPlaybackConnector2/include `
          -IAudioPlaybackConnector2/res `
          -IAudioPlaybackConnector2/ui `
          -IAudioPlaybackConnector2/ui/App `
          -IAudioPlaybackConnector2/ui/MainWindow `
          -IAudioPlaybackConnector2/ui/DevicePickerView `
          -IAudioPlaybackConnector2/ui/SettingsWindow `
          --error-exitcode=1 `
          --template=gcc `
          $files

    - name: Restore NuGet packages
      run: msbuild AudioPlaybackConnector2.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Test CoreRuntime boundary verifier
      run: >
        msbuild AudioPlaybackConnector2.CoreRuntime/AudioPlaybackConnector2.CoreRuntime.vcxproj
        /p:Configuration=Release
        /p:Platform=x64
        /t:TestCoreRuntimeBoundaryVerifier

  build:
    name: Build (${{ matrix.architecture }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          packages
          .nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config', '**/*.vcxproj', '**/*.wapproj', 'Directory.Build.props', 'AudioPlaybackConnector2.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet packages
      run: msbuild AudioPlaybackConnector2.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Build unsigned release
      id: unsigned-build
      run: >
        msbuild AudioPlaybackConnector2.slnx
        /p:Configuration=Release
        /p:Platform=${{ matrix.architecture }}
        /p:AppxBundle=Never
        /p:AppxBundlePlatforms=${{ matrix.architecture }}
        /p:AppxPackageSigningEnabled=false
        /t:Rebuild
        "-bl:${{ runner.temp }}/unsigned-build.binlog;ProjectImports=None"

    - name: Upload explicitly requested unsigned build failure diagnostics
      if: ${{ failure() && steps.unsigned-build.outcome == 'failure' && inputs.upload_failure_binlog }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: unsigned-build-failure-${{ matrix.architecture }}
        path: ${{ runner.temp }}/unsigned-build.binlog
        if-no-files-found: ignore
        retention-days: 1

    - name: Remove unsigned build diagnostics
      if: ${{ always() }}
      shell: pwsh
      run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/unsigned-build.binlog" -Force -ErrorAction SilentlyContinue

    - name: Verify restored dependency licenses
      shell: pwsh
      run: |
        $triplet = '${{ matrix.architecture }}'.ToLowerInvariant() + '-windows-static-md'
        python scripts/verify-dependency-licenses.py --triplet $triplet
        if ($LASTEXITCODE -ne 0) { throw 'Dependency license verification failed.' }

    - name: Check dependency vulnerabilities
      if: ${{ matrix.architecture == 'x64' }}
      shell: pwsh
      run: |
        python scripts/check-dependency-vulnerabilities.py --report "$env:RUNNER_TEMP/dependency-vulnerabilities.json"
        if ($LASTEXITCODE -ne 0) { throw 'Dependency vulnerability check failed; inspect the report or query error.' }

    - name: Run native regression tests
      if: ${{ matrix.architecture == 'x64' }}
      run: .\x64\Release\tests\AudioPlaybackConnector2.CoreTests.exe

    - name: Upload build artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: AudioPlaybackConnector2-${{ matrix.architecture }}-Release
        path: ${{ matrix.architecture }}/Release/AudioPlaybackConnector2/AudioPlaybackConnector2.exe
        if-no-files-found: error
