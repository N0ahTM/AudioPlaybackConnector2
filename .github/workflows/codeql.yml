name: CodeQL Analysis

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '31 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: windows-2025-vs2026
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
      with:
        languages: cpp
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Restore NuGet packages
      run: msbuild AudioPlaybackConnector2.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Build for CodeQL
      run: >
        msbuild AudioPlaybackConnector2.slnx
        /p:Configuration=Release
        /p:Platform=x64
        /p:AppxBundle=Never
        /p:AppxBundlePlatforms=x64
        /p:AppxPackageSigningEnabled=false
        /t:Rebuild
        /m:1

    - name: Run native regression tests
      run: .\x64\Release\tests\AudioPlaybackConnector2.CoreTests.exe

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
      with:
        category: /language:cpp
        output: sarif-results
        # Keep a diagnostic upload when analysis itself fails. Successful runs are
        # filtered below before their results are uploaded.
        upload: failure-only

    - name: Check raw CodeQL results
      shell: pwsh
      run: |
        $sarif = Get-Content sarif-results/cpp.sarif -Raw | ConvertFrom-Json
        $count = ($sarif.runs | ForEach-Object { $_.results.Count } | Measure-Object -Sum).Sum
        Write-Host "Raw CodeQL results: $count"

    - name: Exclude third-party and generated results
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        input: sarif-results/cpp.sarif
        output: sarif-results/cpp-filtered.sarif
        patterns: |
          -**/packages/**
          -**/Generated Files/**
          -**/Generated%20Files/**
          -**/vcpkg_installed/**
          -**/external/**
          -**/third_party/**
          -**/bin/**
          -**/obj/**
          -**/x64/**
          -**/ARM64/**
          -**/Debug/**
          -**/Release/**

    - name: Check filtered CodeQL results
      shell: pwsh
      run: |
        $sarif = Get-Content sarif-results/cpp-filtered.sarif -Raw | ConvertFrom-Json
        $count = ($sarif.runs | ForEach-Object { $_.results.Count } | Measure-Object -Sum).Sum
        Write-Host "First-party CodeQL results: $count"
        $raw = Get-Content sarif-results/cpp.sarif -Raw | ConvertFrom-Json
        $ignoredFolder = '^(packages|Generated Files|vcpkg_installed|external|third_party|bin|obj|x64|ARM64|Debug|Release)$'
        $expected = 0
        foreach ($result in $raw.runs.results) {
          if (-not $result.locations) { $expected++; continue }
          foreach ($location in $result.locations) {
            $uri = $location.physicalLocation.artifactLocation.uri
            if (-not $uri -or -not @([Uri]::UnescapeDataString($uri) -split '[\\/]' | Where-Object {
              $_ -cmatch $ignoredFolder
            }).Count) { $expected++; break }
          }
        }
        if ($count -ne $expected) {
          throw "SARIF filtering kept $count results; expected $expected first-party results."
        }
        $generated = @($sarif.runs | ForEach-Object { $_.results } | Where-Object {
          @($_.locations | Where-Object {
            $uri = $_.physicalLocation.artifactLocation.uri
            $uri -and ([Uri]::UnescapeDataString($uri) -match '[\\/]Generated Files[\\/]')
          }).Count -gt 0
        }).Count
        if ($generated -gt 0) { throw "SARIF still contains $generated generated-code results." }

    - name: Preserve raw SARIF on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codeql-raw-sarif
        path: sarif-results/cpp.sarif
        retention-days: 1

    - name: Upload first-party CodeQL results
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
      with:
        sarif_file: sarif-results/cpp-filtered.sarif
        category: /language:cpp
