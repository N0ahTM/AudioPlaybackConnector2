name: CodeQL Analysis

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '31 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: windows-2025-vs2026
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        languages: cpp
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Restore NuGet packages
      run: msbuild AudioPlaybackConnector2.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Build for CodeQL
      run: >
        msbuild AudioPlaybackConnector2.slnx
        /p:Configuration=Release
        /p:Platform=x64
        /p:AppxBundle=Never
        /p:AppxBundlePlatforms=x64
        /p:AppxPackageSigningEnabled=false
        /t:Rebuild
        /m:1

    - name: Run native regression tests
      run: .\x64\Release\tests\AudioPlaybackConnector2.CoreTests.exe

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        category: /language:cpp
        output: sarif-results
        # Keep a diagnostic upload when analysis itself fails. Successful runs are
        # filtered below before their results are uploaded.
        upload: failure-only

    - name: Check raw CodeQL results
      shell: pwsh
      run: |
        $sarif = Get-Content sarif-results/cpp.sarif -Raw | ConvertFrom-Json
        $count = ($sarif.runs | ForEach-Object { $_.results.Count } | Measure-Object -Sum).Sum
        Write-Host "Raw CodeQL results: $count"
        # Quality alerts are intentionally retained until the next release.
        if ($count -lt 1) { throw 'CodeQL produced no results; inspect the raw SARIF artifact.' }

    - name: Exclude third-party and generated results
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        input: sarif-results/cpp.sarif
        output: sarif-results/cpp-filtered.sarif
        patterns: |
          -**/packages/**
          -**/Generated Files/**
          -**/vcpkg_installed/**
          -**/external/**
          -**/third_party/**
          -**/bin/**
          -**/obj/**
          -**/x64/**
          -**/ARM64/**
          -**/Debug/**
          -**/Release/**

    - name: Check filtered CodeQL results
      shell: pwsh
      run: |
        $sarif = Get-Content sarif-results/cpp-filtered.sarif -Raw | ConvertFrom-Json
        $count = ($sarif.runs | ForEach-Object { $_.results.Count } | Measure-Object -Sum).Sum
        Write-Host "First-party CodeQL results: $count"
        if ($count -lt 1) { throw 'SARIF filtering removed every result; inspect the raw SARIF artifact.' }

    - name: Preserve raw SARIF on failure
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: codeql-raw-sarif
        path: sarif-results/cpp.sarif
        retention-days: 1

    - name: Upload first-party CodeQL results
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        sarif_file: sarif-results/cpp-filtered.sarif
        category: /language:cpp
