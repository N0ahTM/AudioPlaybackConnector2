name: Deploy App Installer Feed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag that contains the MSIX asset.
        required: true
        type: string
      package_version:
        description: Four-part MSIX package version, for example 0.5.0.0.
        required: true
        type: string

env:
  APPINSTALLER_URL: https://n0ahtm.github.io/AudioPlaybackConnector2/AudioPlaybackConnector2.appinstaller

concurrency:
  group: audioplaybackconnector2-production-release
  cancel-in-progress: false

jobs:
  deploy-appinstaller:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0

    - name: Validate inputs and exact tagged source checkout
      shell: pwsh
      run: |
        if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
          throw 'Release tag must look like v0.7.0.'
        }
        $parts = $env:PACKAGE_VERSION.Split('.')
        if ($parts.Count -ne 4) {
          throw 'Package version must have four components.'
        }
        foreach ($part in $parts) {
          [uint64]$component = 0
          if (-not [uint64]::TryParse($part, [ref]$component) -or $component -gt [uint16]::MaxValue) {
            throw 'Package version contains an invalid component.'
          }
        }
        $head = (git rev-parse HEAD).Trim()
        $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
        if ($head -ne $tagCommit) {
          throw "Checked out commit $head does not match $env:RELEASE_TAG ($tagCommit)."
        }

    - name: Download and verify release MSIX
      id: msix
      shell: pwsh
      run: |
        $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
        if ($release.isDraft -or $release.isPrerelease) {
          throw 'The App Installer feed may reference only a published, non-prerelease GitHub Release.'
        }
        $packageDir = Join-Path $env:RUNNER_TEMP 'package'
        New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $packageDir --pattern 'AudioPlaybackConnector2_*_x64.msix' --clobber
        $packages = @(Get-ChildItem -Path $packageDir -Filter '*.msix' -File)
        if ($packages.Count -ne 1) {
          throw "Expected one x64 AudioPlaybackConnector2 MSIX asset, found $($packages.Count)."
        }
        ./scripts/release/verify-msix-package.ps1 `
          -MsixPath $packages[0].FullName `
          -ExpectedPackageVersion $env:PACKAGE_VERSION `
          -ExpectedProcessorArchitecture x64 `
          -ExpectedName N0ahTM.AudioPlaybackConnector2 `
          -ExpectedPublisher 'CN=AudioPlaybackConnector2' `
          -RequiredEntries AudioPlaybackConnector2.exe,AudioPlaybackConnector2.Control.exe `
          -UniqueEntries AudioPlaybackConnector2.exe,AudioPlaybackConnector2.Control.exe `
          -RequireSignature
        "PATH=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT
        "NAME=$($packages[0].Name)" >> $env:GITHUB_OUTPUT

    - name: Download release dependencies
      id: deps
      shell: pwsh
      run: |
        $depsDir = Join-Path $env:RUNNER_TEMP 'dependencies'
        New-Item -ItemType Directory -Path $depsDir -Force | Out-Null
        # Download any framework packages published alongside the release
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $depsDir --pattern "*.appx" --pattern "*.msix" --clobber
        # Remove the main app package so it is not treated as a dependency
        Get-ChildItem -Path $depsDir -File | Where-Object { $_.Name -like "AudioPlaybackConnector2_*.msix" } | Remove-Item
        if ((Get-ChildItem -Path $depsDir -File).Count -eq 0) {
          Write-Warning "No dependency assets found in release."
        }
        "DIR=$depsDir" >> $env:GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Generate App Installer feed
      shell: pwsh
      run: |
        $msixUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$env:MSIX_NAME"
        $depBaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
        New-Item -ItemType Directory -Path pages -Force | Out-Null
        $params = @{
          MsixUrl = $msixUrl
          AppInstallerUrl = $env:APPINSTALLER_URL
          MsixPath = $env:MSIX_PATH
          OutputPath = 'pages/AudioPlaybackConnector2.appinstaller'
          ExpectedPackageVersion = $env:PACKAGE_VERSION
          ProcessorArchitecture = 'x64'
        }
        $depsDir = $env:DEPENDENCIES_DIR
        if ($depsDir -and (Test-Path $depsDir) -and (Get-ChildItem -Path $depsDir -File).Count -gt 0) {
          $params['DependenciesDirectory'] = $depsDir
          $params['DependencyBaseUrl'] = $depBaseUrl
        }
        ./scripts/release/generate-appinstaller.ps1 @params
      env:
        MSIX_NAME: ${{ steps.msix.outputs.NAME }}
        MSIX_PATH: ${{ steps.msix.outputs.PATH }}
        DEPENDENCIES_DIR: ${{ steps.deps.outputs.DIR }}

    - name: Reject App Installer feed downgrades
      shell: pwsh
      run: >
        ./scripts/release/assert-appinstaller-monotonic.ps1
        -AppInstallerUrl '${{ env.APPINSTALLER_URL }}'
        -CandidateVersion $env:PACKAGE_VERSION

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: pages

    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Verify published App Installer feed
      shell: pwsh
      run: >
        ./scripts/release/verify-appinstaller-feed.ps1
        -AppInstallerUrl '${{ env.APPINSTALLER_URL }}'
        -ExpectedPackageVersion $env:PACKAGE_VERSION
        -ExpectedPackageName N0ahTM.AudioPlaybackConnector2
        -ExpectedPublisher 'CN=AudioPlaybackConnector2'
        -ExpectedProcessorArchitecture x64
        -ExpectedPackageUri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$env:MSIX_NAME"
        -VerifyPackageUri
      env:
        MSIX_NAME: ${{ steps.msix.outputs.NAME }}
