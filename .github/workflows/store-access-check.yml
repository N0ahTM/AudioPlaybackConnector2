name: Microsoft Store Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partner-center:
    runs-on: windows-2022
    steps:
    - name: Set up Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

    - name: Verify Microsoft Entra credentials
      shell: pwsh
      env:
        TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      run: |
        $token = Invoke-RestMethod `
          -Method Post `
          -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" `
          -ContentType 'application/x-www-form-urlencoded' `
          -Body @{
            client_id = $env:CLIENT_ID
            client_secret = $env:CLIENT_SECRET
            grant_type = 'client_credentials'
            scope = 'https://api.store.microsoft.com/.default'
          }
        if ([string]::IsNullOrWhiteSpace($token.access_token)) {
          throw 'Microsoft Entra returned no access token.'
        }
        Write-Host 'Microsoft Entra client credentials are valid.'

    - name: Authenticate with Partner Center
      shell: pwsh
      env:
        TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        SELLER_ID: ${{ secrets.SELLER_ID }}
        CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      run: |
        msstore reconfigure `
          --tenantId $env:TENANT_ID `
          --sellerId $env:SELLER_ID `
          --clientId $env:CLIENT_ID `
          --clientSecret $env:CLIENT_SECRET

    - name: Read current submission status
      shell: pwsh
      run: msstore submission status 9N366PGKJZ0K
