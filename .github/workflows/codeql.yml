name: CodeQL Analysis

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '31 3 * * 1'

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: windows-2022
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
      with:
        languages: cpp
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Restore NuGet packages
      run: msbuild AudioPlaybackConnector2.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Build for CodeQL
      run: >
        msbuild AudioPlaybackConnector2.slnx
        /p:Configuration=Release
        /p:Platform=x64
        /p:AppxBundle=Never
        /p:AppxBundlePlatforms=x64
        /p:AppxPackageSigningEnabled=false
        /t:Rebuild
        /m:1

    - name: Run native regression tests
      run: .\x64\Release\tests\AudioPlaybackConnector2.CoreTests.exe

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
      with:
        category: /language:cpp
