name: Deploy App Installer Feed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag that contains the MSIX asset.
        required: true
        type: string
      package_version:
        description: Four-part MSIX package version, for example 1.2.3.0.
        required: true
        type: string

env:
  APPINSTALLER_URL: https://n0ahtm.github.io/AudioPlaybackConnector2/AudioPlaybackConnector2.appinstaller

concurrency:
  group: audioplaybackconnector2-production-release
  cancel-in-progress: false

jobs:
  deploy-appinstaller:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0

    - name: Validate inputs and exact tagged source checkout
      shell: pwsh
      run: |
        if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
          throw 'Release tag must look like v1.2.3.'
        }
        $parts = $env:PACKAGE_VERSION.Split('.')
        if ($parts.Count -ne 4) {
          throw 'Package version must have four components.'
        }
        foreach ($part in $parts) {
          [uint64]$component = 0
          if (-not [uint64]::TryParse($part, [ref]$component) -or $component -gt [uint16]::MaxValue) {
            throw 'Package version contains an invalid component.'
          }
        }
        $expectedVersion = $env:RELEASE_TAG.TrimStart('v') + '.0'
        if ($env:PACKAGE_VERSION -ne $expectedVersion) {
          throw "Package version $env:PACKAGE_VERSION does not match release tag $env:RELEASE_TAG."
        }
        $head = (git rev-parse HEAD).Trim()
        $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
        if ($head -ne $tagCommit) {
          throw "Checked out commit $head does not match $env:RELEASE_TAG ($tagCommit)."
        }

    - name: Download and verify release MSIX
      id: msix
      shell: pwsh
      run: |
        $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
        if ($release.isDraft -or $release.isPrerelease) {
          throw 'The App Installer feed may reference only a published, non-prerelease GitHub Release.'
        }
        $packageDir = Join-Path $env:RUNNER_TEMP 'package'
        New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $packageDir --pattern 'AudioPlaybackConnector2_*_x64.msix' --clobber
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $packageDir --pattern 'AudioPlaybackConnector2.cer' --clobber
        $packages = @(Get-ChildItem -Path $packageDir -Filter '*.msix' -File)
        $certificates = @(Get-ChildItem -Path $packageDir -Filter '*.cer' -File)
        if ($packages.Count -ne 1) {
          throw "Expected one x64 AudioPlaybackConnector2 MSIX asset, found $($packages.Count)."
        }
        if ($certificates.Count -ne 1) {
          throw "Expected one AudioPlaybackConnector2 certificate asset, found $($certificates.Count)."
        }
        if ((Get-FileHash $certificates[0].FullName).Hash -ne (Get-FileHash 'certs/AudioPlaybackConnector2.cer').Hash) {
          throw 'Published certificate does not match the certificate in the tagged source.'
        }
        ./scripts/release/verify-msix-package.ps1 `
          -MsixPath $packages[0].FullName `
          -ExpectedPackageVersion $env:PACKAGE_VERSION `
          -ExpectedProcessorArchitecture x64 `
          -ExpectedName N0ahTM.AudioPlaybackConnector2 `
          -ExpectedPublisher 'CN=AudioPlaybackConnector2' `
          -ExpectedCertificatePath $certificates[0].FullName `
          -RequiredEntries AudioPlaybackConnector2.exe,AudioPlaybackConnector2.Control/AudioPlaybackConnector2.Control.exe `
          -UniqueEntries AudioPlaybackConnector2.exe,AudioPlaybackConnector2.Control/AudioPlaybackConnector2.Control.exe `
          -RequireSignature
        "PATH=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT
        "NAME=$($packages[0].Name)" >> $env:GITHUB_OUTPUT

    - name: Download release dependencies
      id: deps
      shell: pwsh
      run: |
        $depsDir = Join-Path $env:RUNNER_TEMP 'dependencies'
        New-Item -ItemType Directory -Path $depsDir -Force | Out-Null
        # Download any framework packages published alongside the release
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $depsDir --pattern "*.appx" --pattern "*.msix" --clobber
        # Remove the main app package so it is not treated as a dependency
        Get-ChildItem -Path $depsDir -File | Where-Object { $_.Name -like "AudioPlaybackConnector2_*.msix" } | Remove-Item
        if ((Get-ChildItem -Path $depsDir -File).Count -eq 0) {
          Write-Warning "No dependency assets found in release."
        } else {
          ./scripts/release/verify-dependency-packages.ps1 `
            -DependenciesDirectory $depsDir `
            -ExpectedProcessorArchitecture x64
        }
        "DIR=$depsDir" >> $env:GITHUB_OUTPUT

    - name: Generate App Installer feed
      shell: pwsh
      run: |
        $msixUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$env:MSIX_NAME"
        $depBaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
        New-Item -ItemType Directory -Path pages -Force | Out-Null
        $params = @{
          MsixUrl = $msixUrl
          AppInstallerUrl = $env:APPINSTALLER_URL
          MsixPath = $env:MSIX_PATH
          OutputPath = 'pages/AudioPlaybackConnector2.appinstaller'
          ExpectedPackageVersion = $env:PACKAGE_VERSION
          ProcessorArchitecture = 'x64'
        }
        $depsDir = $env:DEPENDENCIES_DIR
        if ($depsDir -and (Test-Path $depsDir) -and (Get-ChildItem -Path $depsDir -File).Count -gt 0) {
          $params['DependenciesDirectory'] = $depsDir
          $params['DependencyBaseUrl'] = $depBaseUrl
        }
        ./scripts/release/generate-appinstaller.ps1 @params
      env:
        MSIX_NAME: ${{ steps.msix.outputs.NAME }}
        MSIX_PATH: ${{ steps.msix.outputs.PATH }}
        DEPENDENCIES_DIR: ${{ steps.deps.outputs.DIR }}

    - name: Back up current feed and reject App Installer downgrades
      id: feed-backup
      shell: pwsh
      run: |
        $rollbackDir = Join-Path $env:RUNNER_TEMP 'pages-rollback'
        $backupPath = Join-Path $rollbackDir 'AudioPlaybackConnector2.appinstaller'
        ./scripts/release/assert-appinstaller-monotonic.ps1 `
          -AppInstallerUrl '${{ env.APPINSTALLER_URL }}' `
          -CandidateVersion $env:PACKAGE_VERSION `
          -CandidatePackageUri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$env:MSIX_NAME" `
          -CandidatePackageName N0ahTM.AudioPlaybackConnector2 `
          -CandidatePublisher 'CN=AudioPlaybackConnector2' `
          -CandidateProcessorArchitecture x64 `
          -BackupPath $backupPath

        if (Test-Path -LiteralPath $backupPath) {
          "EXISTS=true" >> $env:GITHUB_OUTPUT
          "SHA256=$((Get-FileHash -LiteralPath $backupPath -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
        } else {
          New-Item -ItemType Directory -Path $rollbackDir -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $rollbackDir 'index.html'), 'No App Installer feed is currently published.')
          "EXISTS=false" >> $env:GITHUB_OUTPUT
          "SHA256=" >> $env:GITHUB_OUTPUT
        }
      env:
        MSIX_NAME: ${{ steps.msix.outputs.NAME }}

    - name: Configure GitHub Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        name: github-pages-candidate
        path: pages

    - name: Upload App Installer rollback artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        name: github-pages-rollback
        path: ${{ runner.temp }}/pages-rollback

    - name: Mark deployment attempt
      id: deployment-attempt
      run: echo "App Installer deployment is starting."

    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      with:
        artifact_name: github-pages-candidate

    - name: Verify published App Installer feed
      shell: pwsh
      run: >
        ./scripts/release/verify-appinstaller-feed.ps1
        -AppInstallerUrl '${{ env.APPINSTALLER_URL }}'
        -ExpectedPackageVersion $env:PACKAGE_VERSION
        -ExpectedPackageName N0ahTM.AudioPlaybackConnector2
        -ExpectedPublisher 'CN=AudioPlaybackConnector2'
        -ExpectedProcessorArchitecture x64
        -ExpectedPackageUri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$env:MSIX_NAME"
        -VerifyPackageUri
      env:
        MSIX_NAME: ${{ steps.msix.outputs.NAME }}

    - name: Return GitHub Release to draft after deployment failure
      if: ${{ failure() && steps.deployment-attempt.outcome == 'success' }}
      shell: pwsh
      run: |
        gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=true
        $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
        if (-not $release.isDraft) {
          throw 'Release did not return to draft state.'
        }

    - name: Restore previous GitHub Pages feed
      id: rollback-deployment
      if: ${{ failure() && steps.deployment-attempt.outcome == 'success' }}
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      with:
        artifact_name: github-pages-rollback

    - name: Verify restored App Installer feed
      if: ${{ failure() && steps.deployment-attempt.outcome == 'success' && steps.rollback-deployment.outcome == 'success' }}
      shell: pwsh
      run: |
        $hadFeed = '${{ steps.feed-backup.outputs.EXISTS }}' -eq 'true'
        $expectedHash = '${{ steps.feed-backup.outputs.SHA256 }}'
        $downloadPath = Join-Path $env:RUNNER_TEMP 'restored.appinstaller'
        for ($attempt = 1; $attempt -le 6; $attempt++) {
          try {
            Invoke-WebRequest -Uri $env:APPINSTALLER_URL -OutFile $downloadPath -TimeoutSec 30 -ErrorAction Stop
            if (-not $hadFeed) {
              throw 'The App Installer feed still exists although no previous feed was available.'
            }
            $actualHash = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) {
              throw "Restored feed hash $actualHash does not match $expectedHash."
            }
            Write-Host "Previous App Installer feed restored: $actualHash"
            exit 0
          } catch {
            $statusCode = if ($null -ne $_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if (-not $hadFeed -and $statusCode -eq 404) {
              Write-Host 'App Installer feed removal verified.'
              exit 0
            }
            if ($attempt -eq 6) { throw }
            Start-Sleep -Seconds 10
          }
        }
