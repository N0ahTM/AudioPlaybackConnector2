name: Build Release Artifacts

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      semver:
        required: true
        type: string
      package_version:
        required: true
        type: string
      run_static_analysis:
        required: false
        default: false
        type: boolean
    secrets:
      SIGNING_CERTIFICATE_PFX:
        required: true
      SIGNING_CERTIFICATE_PASSWORD:
        required: true
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
      bundle_name:
        value: ${{ jobs.build.outputs.bundle_name }}
      dependency_names:
        value: ${{ jobs.build.outputs.dependency_names }}
      store_upload_name:
        value: ${{ jobs.build.outputs.store_upload_name }}

env:
  APPINSTALLER_URL: https://n0ahtm.github.io/AudioPlaybackConnector2/AudioPlaybackConnector2.appinstaller
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_name: ${{ steps.artifacts.outputs.ARTIFACT_NAME }}
      bundle_name: ${{ steps.artifacts.outputs.BUNDLE_NAME }}
      dependency_names: ${{ steps.artifacts.outputs.DEPENDENCY_NAMES }}
      store_upload_name: ${{ steps.store-upload.outputs.NAME }}

    steps:
    - name: Checkout release source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ inputs.source_ref }}
        fetch-depth: 0

    - name: Validate release inputs
      shell: pwsh
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_SEMVER: ${{ inputs.semver }}
        RELEASE_PACKAGE_VERSION: ${{ inputs.package_version }}
      run: |
        Import-Module ./scripts/release/ReleaseVersion.psm1 -Force
        $version = Resolve-ReleaseVersion -Tag $env:RELEASE_TAG
        if ($env:RELEASE_SEMVER -cne $version.SemVer -or $env:RELEASE_PACKAGE_VERSION -cne $version.PackageVersion) {
          throw 'Release inputs disagree with the version derived from the tag.'
        }

    - name: Validate release documentation and metadata
      shell: pwsh
      run: |
        ./scripts/validate-localizations.ps1
        ./scripts/validate-markdown-links.ps1
        ./scripts/update-cli-reference.ps1 -Check
        ./scripts/test-release-promotion.ps1
        ./scripts/test-build-attestations.ps1
        python scripts/test-sbom.py
        if ($LASTEXITCODE -ne 0) { throw "SBOM gate tests failed." }
        python scripts/test-dependency-vulnerabilities.py
        if ($LASTEXITCODE -ne 0) { throw "Dependency vulnerability gate tests failed." }
        python scripts/test-dependency-licenses.py
        if ($LASTEXITCODE -ne 0) { throw "Dependency license gate tests failed." }
        ./scripts/test-package-notices.ps1
        ./scripts/test-release-version.ps1
        ./scripts/release/validate-release-metadata.ps1 -Version '${{ inputs.semver }}'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          packages
          .nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config', '**/*.vcxproj', '**/*.wapproj', 'Directory.Build.props', 'AudioPlaybackConnector2.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install static analysis tools
      if: ${{ inputs.run_static_analysis }}
      shell: pwsh
      run: |
        choco install llvm --version=22.1.7 -y --no-progress
        choco install cppcheck --version=2.19.0 -y --no-progress
        'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        'C:\Program Files\Cppcheck' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Check formatting
      if: ${{ inputs.run_static_analysis }}
      shell: pwsh
      run: |
        $files = git ls-files '*.cpp' '*.h' '*.hpp' '*.cxx' '*.cc' '*.ixx'
        clang-format --dry-run --Werror $files

    - name: Run CppCheck
      if: ${{ inputs.run_static_analysis }}
      shell: pwsh
      run: |
        $files = git ls-files 'AudioPlaybackConnector2/src/*.cpp' 'AudioPlaybackConnector2/ui/*.cpp'
        cppcheck `
          --enable=warning,performance,portability `
          --std=c++20 `
          --language=c++ `
          --platform=win64 `
          --inline-suppr `
          -IAudioPlaybackConnector2/include `
          -IAudioPlaybackConnector2/res `
          -IAudioPlaybackConnector2/ui `
          -IAudioPlaybackConnector2/ui/App `
          -IAudioPlaybackConnector2/ui/MainWindow `
          -IAudioPlaybackConnector2/ui/DevicePickerView `
          -IAudioPlaybackConnector2/ui/SettingsWindow `
          --error-exitcode=1 `
          --template=gcc `
          $files

    - name: Decode signing certificate
      id: cert
      shell: pwsh
      env:
        SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
      run: |
        $certPath = Join-Path $env:RUNNER_TEMP 'AudioPlaybackConnector2.pfx'
        [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))
        "PATH=$certPath" >> $env:GITHUB_OUTPUT

    - name: Restore NuGet packages
      run: msbuild AudioPlaybackConnector2.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Test CoreRuntime boundary verifier
      run: >
        msbuild AudioPlaybackConnector2.CoreRuntime/AudioPlaybackConnector2.CoreRuntime.vcxproj
        /p:Configuration=Release
        /p:Platform=x64
        /t:TestCoreRuntimeBoundaryVerifier

    - name: Build signed x64 and ARM64 MSIX bundle
      shell: pwsh
      env:
        SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      run: |
        $root = Join-Path $env:RUNNER_TEMP 'msix-bundle'
        $dependencies = Join-Path $root 'Dependencies'
        & msbuild 'AudioPlaybackConnector2 (Package)\AudioPlaybackConnector2 (Package).wapproj' `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:ReleaseTag=${{ inputs.tag }} `
          /p:PackageVersion=${{ inputs.package_version }} `
          "/p:AppxPackageDir=$root\" `
          "/p:AppxPackageTestDir=$root\" `
          "/p:AppxPackageTestExternalPackagesDir=$dependencies" `
          /p:AppxPackageSigningEnabled=true `
          "/p:PackageCertificateKeyFile=${{ steps.cert.outputs.PATH }}" `
          "/p:PackageCertificatePassword=$env:SIGNING_CERTIFICATE_PASSWORD" `
          /p:UapAppxPackageBuildMode=SideloadOnly `
          /p:AppxBundle=Always `
          '/p:AppxBundlePlatforms=x64|ARM64' `
          /t:Rebuild
        if ($LASTEXITCODE -ne 0) { throw "MSIX bundle build failed with exit code $LASTEXITCODE." }

    - name: Build regression tests for both architectures
      shell: pwsh
      run: |
        foreach ($architecture in @('x64', 'ARM64')) {
          & msbuild AudioPlaybackConnector2.CoreTests/AudioPlaybackConnector2.CoreTests.vcxproj `
            /p:Configuration=Release /p:Platform=$architecture `
            /p:ReleaseTag=${{ inputs.tag }} /p:PackageVersion=${{ inputs.package_version }} /t:Build
          if ($LASTEXITCODE -ne 0) { throw "$architecture test build failed with exit code $LASTEXITCODE." }
        }

    - name: Verify restored dependency licenses
      shell: pwsh
      run: |
        foreach ($triplet in @('x64-windows-static-md', 'arm64-windows-static-md')) {
          python scripts/verify-dependency-licenses.py --triplet $triplet
          if ($LASTEXITCODE -ne 0) { throw "Dependency license verification failed: $triplet" }
        }

    - name: Analyze CoreRuntime with clang-tidy
      if: ${{ inputs.run_static_analysis }}
      shell: pwsh
      run: ./scripts/run-clang-tidy.ps1 -ToolPath 'C:/Program Files/LLVM/bin/clang-tidy.exe' -LogPath "$env:RUNNER_TEMP/clang-tidy-core.log"

    - name: Check dependency vulnerabilities
      shell: pwsh
      run: |
        python scripts/check-dependency-vulnerabilities.py --report "$env:RUNNER_TEMP/dependency-vulnerabilities.json"
        if ($LASTEXITCODE -ne 0) { throw 'Dependency vulnerability check failed; inspect the report or query error.' }

    - name: Run x64 regression tests
      run: .\x64\Release\tests\AudioPlaybackConnector2.CoreTests.exe

    - name: Verify signed bundle
      id: bundle
      shell: pwsh
      run: |
        $bundle = Join-Path $env:RUNNER_TEMP 'msix-bundle\AudioPlaybackConnector2 (Package)_${{ inputs.package_version }}_x64_ARM64.msixbundle'
        ./scripts/release/verify-msix-bundle.ps1 `
          -BundlePath $bundle `
          -ExpectedPackageVersion '${{ inputs.package_version }}' `
          -ExpectedName N0ahTM.AudioPlaybackConnector2 `
          -ExpectedPublisher 'CN=AudioPlaybackConnector2' `
          -ExpectedProcessorArchitectures x64,arm64 `
          -ExpectedCertificatePath 'certs/AudioPlaybackConnector2.cer' `
          -RequireSignature `
          -WriteGitHubOutput

    - name: Package the shared binaries for Microsoft Store
      shell: pwsh
      run: |
        # DesktopBridge builds references through _TargetsToBuild even when BuildProjectReferences is false.
        # Request output paths only: the signed-bundle build already produced both architectures.
        $root = Join-Path $env:RUNNER_TEMP 'store-upload'
        & msbuild 'AudioPlaybackConnector2 (Package)\AudioPlaybackConnector2 (Package).wapproj' `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:ReleaseTag=${{ inputs.tag }} `
          /p:PackageVersion=${{ inputs.package_version }} `
          "/p:AppxPackageDir=$root\" `
          /p:AppxPackageSigningEnabled=false `
          /p:StorePackage=true `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:GenerateAppxPackageOnBuild=true `
          /p:AppxBundle=Always `
          '/p:AppxBundlePlatforms=x64|ARM64' `
          /p:_TargetsToBuild=GetTargetPath `
          /t:Build
        if ($LASTEXITCODE -ne 0) { throw "Microsoft Store package build failed with exit code $LASTEXITCODE." }

    - name: Verify Microsoft Store upload package
      id: store-upload
      shell: pwsh
      run: |
        $uploads = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'store-upload') -Recurse -File -Filter '*.msixupload')
        if ($uploads.Count -ne 1) {
          throw "Expected exactly one .msixupload file, found $($uploads.Count)."
        }

        $extractRoot = Join-Path $env:RUNNER_TEMP 'store-upload-contents'
        [IO.Compression.ZipFile]::ExtractToDirectory($uploads[0].FullName, $extractRoot)
        $bundles = @(Get-ChildItem $extractRoot -Recurse -File -Filter '*.msixbundle')
        if ($bundles.Count -ne 1) {
          throw "Expected exactly one MSIX bundle inside the upload file, found $($bundles.Count)."
        }
        ./scripts/release/verify-msix-bundle.ps1 `
          -BundlePath $bundles[0].FullName `
          -ExpectedPackageVersion '${{ inputs.package_version }}' `
          -ExpectedName 12144NoahMeyer.AudioPlaybackConnector2 `
          -ExpectedPublisher 'CN=3784F101-6355-463B-A35E-41BD0A95071B' `
          -ExpectedProcessorArchitectures x64,arm64

        Import-Module ./scripts/release/PackageVerification.psm1 -Force
        Assert-AppBundleBinaries -BundlePath $bundles[0].FullName -ReferenceBundlePath '${{ steps.bundle.outputs.PATH }}'

        "PATH=$($uploads[0].FullName)" >> $env:GITHUB_OUTPUT
        "NAME=$($uploads[0].Name)" >> $env:GITHUB_OUTPUT

    - name: Extract changelog
      id: changelog
      shell: pwsh
      run: |
        $outputPath = Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md'
        ./scripts/release/extract-changelog.ps1 -Version '${{ inputs.tag }}' -OutputPath $outputPath

    - name: Assemble release artifacts
      id: artifacts
      shell: pwsh
      run: |
        $stage = Join-Path $env:RUNNER_TEMP 'release-artifacts'
        $dependencies = Join-Path $stage 'Dependencies'
        New-Item -ItemType Directory -Path $stage -Force | Out-Null

        $bundleName = 'AudioPlaybackConnector2_${{ inputs.package_version }}_x64_ARM64.msixbundle'
        $bundlePath = Join-Path $stage $bundleName
        Copy-Item -LiteralPath '${{ steps.bundle.outputs.PATH }}' -Destination $bundlePath

        $sourceDependencies = Join-Path $env:RUNNER_TEMP 'msix-bundle\Dependencies'
        if (Test-Path -LiteralPath $sourceDependencies) {
          ./scripts/release/collect-dependency-packages.ps1 `
            -DependenciesDirectory $sourceDependencies `
            -OutputDirectory $dependencies `
            -Architectures x64,arm64
        }

        $packageUrl = 'https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/' + $bundleName
        $dependencyBaseUrl = 'https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}'
        $appInstallerPath = Join-Path $stage 'AudioPlaybackConnector2.appinstaller'
        $feedParams = @{
          PackageUrl = $packageUrl
          AppInstallerUrl = $env:APPINSTALLER_URL
          PackagePath = $bundlePath
          OutputPath = $appInstallerPath
          ExpectedPackageVersion = '${{ inputs.package_version }}'
        }
        if (Test-Path -LiteralPath $dependencies) {
          $feedParams.DependenciesDirectory = $dependencies
          $feedParams.DependencyBaseUrl = $dependencyBaseUrl
        }
        ./scripts/release/generate-appinstaller.ps1 @feedParams

        Copy-Item -LiteralPath 'certs/AudioPlaybackConnector2.cer' -Destination $stage

        Copy-Item -LiteralPath '${{ steps.changelog.outputs.PATH }}' -Destination $stage
        Copy-Item -LiteralPath '${{ steps.store-upload.outputs.PATH }}' -Destination $stage

        $dependencyNames = @(Get-ChildItem -Path $dependencies -Recurse -File -ErrorAction SilentlyContinue |
          Sort-Object Name |
          ForEach-Object Name)
        $artifactName = 'AudioPlaybackConnector2-release-${{ inputs.package_version }}'
        "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_OUTPUT
        "BUNDLE_NAME=$bundleName" >> $env:GITHUB_OUTPUT
        "DEPENDENCY_NAMES=$($dependencyNames -join ',')" >> $env:GITHUB_OUTPUT
        "DIR=$stage" >> $env:GITHUB_OUTPUT

    - name: Generate and verify release-drop SBOM
      shell: pwsh
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_DROP: ${{ steps.artifacts.outputs.DIR }}
      run: ./scripts/release/generate-sbom.ps1 -DropPath $env:RELEASE_DROP -Tag $env:RELEASE_TAG

    - name: Attest package SBOM
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      with:
        subject-path: |
          ${{ steps.artifacts.outputs.DIR }}/*.msixbundle
          ${{ steps.artifacts.outputs.DIR }}/*.msixupload
          ${{ steps.artifacts.outputs.DIR }}/Dependencies/**
          ${{ steps.artifacts.outputs.DIR }}/*.appinstaller
        sbom-path: ${{ steps.artifacts.outputs.DIR }}/_manifest/spdx_2.2/manifest.spdx.json

    - name: Attest provenance of complete release drop
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      with:
        subject-path: ${{ steps.artifacts.outputs.DIR }}/**

    - name: Upload release artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.artifacts.outputs.ARTIFACT_NAME }}
        path: ${{ steps.artifacts.outputs.DIR }}
        if-no-files-found: error
        retention-days: 30
