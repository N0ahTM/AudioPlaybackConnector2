name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.8.0.
        required: true
        type: string

env:
  APPINSTALLER_URL: https://n0ahtm.github.io/AudioPlaybackConnector2/AudioPlaybackConnector2.appinstaller

concurrency:
  group: audioplaybackconnector2-production-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    permissions:
      contents: write
      pages: write
    outputs:
      semver: ${{ steps.version.outputs.SEMVER }}
      tag: ${{ steps.version.outputs.TAG }}
      version: ${{ steps.version.outputs.VERSION }}
      msix_name: ${{ steps.msix.outputs.NAME }}
      web_setup_name: ${{ steps.installers.outputs.WEB_NAME }}
      bundle_setup_name: ${{ steps.installers.outputs.BUNDLE_NAME }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        fetch-depth: 0

    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") {
          $env:INPUT_TAG
        } else {
          $env:REF_NAME
        }
        if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
          throw "Release tag must look like v0.8.0."
        }

        $semver = $tag.TrimStart('v')
        $quad = "$semver.0"
        "TAG=$tag" >> $env:GITHUB_OUTPUT
        "SEMVER=$semver" >> $env:GITHUB_OUTPUT
        "VERSION=$quad" >> $env:GITHUB_OUTPUT
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ inputs.tag }}
        REF_NAME: ${{ github.ref_name }}

    - name: Verify exact tagged source checkout
      shell: pwsh
      run: |
        $tag = '${{ steps.version.outputs.TAG }}'
        $head = (git rev-parse HEAD).Trim()
        $tagCommit = (git rev-parse "$tag^{commit}").Trim()
        if ($head -ne $tagCommit) {
          throw "Checked out commit $head does not match $tag ($tagCommit)."
        }

    - name: Patch version into package metadata
      shell: pwsh
      run: ./scripts/release/update-package-version.ps1 -Version '${{ steps.version.outputs.VERSION }}'

    - name: Decode signing certificate
      id: cert
      shell: pwsh
      run: |
        $certPath = "$env:TEMP\AudioPlaybackConnector2.pfx"
        $bytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE_PFX }}")
        [IO.File]::WriteAllBytes($certPath, $bytes)
        "CERT_PATH=$certPath" >> $env:GITHUB_OUTPUT

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: msbuild AudioPlaybackConnector2.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Build signed MSIX (Release, x64)
      run: >
        msbuild AudioPlaybackConnector2.slnx
        /p:Configuration=Release
        /p:Platform=x64
        /p:AppxPackageSigningEnabled=true
        /p:PackageCertificateKeyFile=${{ steps.cert.outputs.CERT_PATH }}
        /p:PackageCertificatePassword=${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        /p:UapAppxPackageBuildMode=SideloadOnly
        /p:AppxBundle=Never
        /t:Rebuild

    - name: Locate MSIX
      id: msix
      shell: pwsh
      run: ./scripts/release/locate-msix.ps1 -Version '${{ steps.version.outputs.VERSION }}' -Configuration Release -Architecture x64

    - name: Verify built MSIX metadata and payload
      id: package
      shell: pwsh
      run: >
        ./scripts/release/verify-msix-package.ps1
        -MsixPath '${{ steps.msix.outputs.PATH }}'
        -ExpectedPackageVersion '${{ steps.version.outputs.VERSION }}'
        -ExpectedProcessorArchitecture x64
        -ExpectedName N0ahTM.AudioPlaybackConnector2
        -ExpectedPublisher 'CN=AudioPlaybackConnector2'
        -RequiredEntries AudioPlaybackConnector2.exe,AudioPlaybackConnector2.Control/AudioPlaybackConnector2.Control.exe
        -UniqueEntries AudioPlaybackConnector2.exe,AudioPlaybackConnector2.Control/AudioPlaybackConnector2.Control.exe
        -RequireSignature
        -WriteGitHubOutput

    - name: Run native regression tests
      run: .\x64\Release\tests\AudioPlaybackConnector2.CoreTests.exe

    - name: Collect dependencies
      id: deps
      shell: pwsh
      run: |
        $depsDir = '${{ steps.msix.outputs.DEPS_DIR }}'
        if (-not $depsDir -or -not (Test-Path $depsDir)) {
          Write-Host "No dependencies directory found."
          exit 0
        }
        $staging = Join-Path $env:RUNNER_TEMP 'dependencies'
        New-Item -ItemType Directory -Path $staging -Force | Out-Null
        $files = Get-ChildItem -Path $depsDir -Recurse -Include @("*.appx", "*.msix")
        foreach ($f in $files) {
          Copy-Item -LiteralPath $f.FullName -Destination $staging -Force
        }
        "DIR=$staging" >> $env:GITHUB_OUTPUT
        Get-ChildItem -Path $staging | ForEach-Object { Write-Host "Dependency: $($_.Name)" }

    - name: Extract changelog
      id: changelog
      shell: pwsh
      run: ./scripts/release/extract-changelog.ps1 -Version '${{ steps.version.outputs.TAG }}'

    - name: Generate App Installer feed
      id: appinstaller
      shell: pwsh
      run: |
        $msixUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/${{ steps.msix.outputs.NAME }}"
        $depBaseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}"
        $outputPath = Join-Path $env:RUNNER_TEMP 'AudioPlaybackConnector2.appinstaller'
        $depsDir = '${{ steps.deps.outputs.DIR }}'
        $params = @{
          MsixUrl = $msixUrl
          AppInstallerUrl = $env:APPINSTALLER_URL
          MsixPath = '${{ steps.msix.outputs.PATH }}'
          OutputPath = $outputPath
          ExpectedPackageVersion = '${{ steps.version.outputs.VERSION }}'
          ProcessorArchitecture = 'x64'
        }
        if ($depsDir -and (Test-Path $depsDir)) {
          $params['DependenciesDirectory'] = $depsDir
          $params['DependencyBaseUrl'] = $depBaseUrl
        }
        ./scripts/release/generate-appinstaller.ps1 @params
        "PATH=$outputPath" >> $env:GITHUB_OUTPUT

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Build bootstrapper installers
      id: installers
      shell: pwsh
      run: |
        $outputDir = Join-Path $env:RUNNER_TEMP 'installers'
        $bundleParams = @{
          Mode = 'Bundle'
          MsixPath = '${{ steps.msix.outputs.PATH }}'
          CertPath = 'certs/AudioPlaybackConnector2.cer'
          Version = '${{ steps.version.outputs.SEMVER }}'
          OutputDir = $outputDir
        }
        $depsDir = '${{ steps.deps.outputs.DIR }}'
        if ($depsDir -and (Test-Path $depsDir)) {
          $bundleParams['DependenciesDir'] = $depsDir
        }
        ./installer/build-installer.ps1 @bundleParams
        ./installer/build-installer.ps1 `
          -Mode Web `
          -CertPath 'certs/AudioPlaybackConnector2.cer' `
          -Version '${{ steps.version.outputs.SEMVER }}' `
          -OutputDir $outputDir

        $bundlePath = Join-Path $outputDir 'AudioPlaybackConnector2-Setup-${{ steps.version.outputs.SEMVER }}.exe'
        $webPath = Join-Path $outputDir 'AudioPlaybackConnector2-WebSetup.exe'
        if (-not (Test-Path $bundlePath) -or -not (Test-Path $webPath)) {
          throw 'One or more bootstrapper installers were not created.'
        }
        "BUNDLE_PATH=$bundlePath" >> $env:GITHUB_OUTPUT
        "WEB_PATH=$webPath" >> $env:GITHUB_OUTPUT
        "BUNDLE_NAME=$([IO.Path]::GetFileName($bundlePath))" >> $env:GITHUB_OUTPUT
        "WEB_NAME=$([IO.Path]::GetFileName($webPath))" >> $env:GITHUB_OUTPUT

    - name: Reject App Installer feed downgrades
      shell: pwsh
      run: >
        ./scripts/release/assert-appinstaller-monotonic.ps1
        -AppInstallerUrl '${{ env.APPINSTALLER_URL }}'
        -CandidateVersion '${{ steps.version.outputs.VERSION }}'

    - name: Build release body
      id: body
      shell: pwsh
      run: |
        $changelog = @'
        ${{ steps.changelog.outputs.BODY }}
        '@
        $footer = @'

        ---

        ## Installation

        **Recommended:** Download and run `AudioPlaybackConnector2-WebSetup.exe`.

        For offline installation, use the versioned `AudioPlaybackConnector2-Setup-${{ steps.version.outputs.SEMVER }}.exe`.

        Both installers work per-user without administrator rights. Windows SmartScreen may warn because the setup executables are not yet code-signed.

        For App Installer, direct MSIX installation, certificates, and dependency packages, see the [installation guide](https://github.com/N0ahTM/AudioPlaybackConnector2/blob/main/docs/INSTALLATION.md).

        > Releases are signed with a self-signed certificate. A free open-source code-signing certificate has been requested but approval may take some time.
        '@
        $fullBody = ($changelog.Trim() + "`n" + $footer).Trim()
        $bodyPath = Join-Path $env:RUNNER_TEMP 'release-body.md'
        [System.IO.File]::WriteAllText($bodyPath, $fullBody)
        "PATH=$bodyPath" >> $env:GITHUB_OUTPUT

    - name: Create draft GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: v${{ steps.version.outputs.SEMVER }}
        draft: true
        overwrite_files: true
        body_path: ${{ steps.body.outputs.PATH }}
        files: |
          ${{ steps.msix.outputs.PATH }}
          ${{ steps.appinstaller.outputs.PATH }}
          ${{ steps.installers.outputs.WEB_PATH }}
          ${{ steps.installers.outputs.BUNDLE_PATH }}
          certs/AudioPlaybackConnector2.cer
        fail_on_unmatched_files: true

    - name: Upload dependency assets
      if: steps.deps.outputs.DIR != ''
      shell: pwsh
      run: |
        $deps = Get-ChildItem -Path '${{ steps.deps.outputs.DIR }}' -File
        foreach ($dep in $deps) {
          gh release upload "${{ steps.version.outputs.TAG }}" $dep.FullName --repo "${{ github.repository }}" --clobber
        }
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Stage App Installer feed for GitHub Pages
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path pages -Force | Out-Null
        Copy-Item -LiteralPath '${{ steps.appinstaller.outputs.PATH }}' -Destination 'pages/AudioPlaybackConnector2.appinstaller' -Force

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: pages

  publish-release:
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write

    steps:
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release edit "${{ needs.build-release.outputs.tag }}" --repo "${{ github.repository }}" --draft=false

    - name: Verify public release assets
      shell: bash
      run: |
        assets=(
          "${{ needs.build-release.outputs.msix_name }}"
          "${{ needs.build-release.outputs.web_setup_name }}"
          "${{ needs.build-release.outputs.bundle_setup_name }}"
        )
        for asset in "${assets[@]}"; do
          asset_url="https://github.com/${{ github.repository }}/releases/download/${{ needs.build-release.outputs.tag }}/$asset"
          verified=false
          for attempt in {1..6}; do
            if curl --fail --location --silent --show-error --head "$asset_url" > /dev/null; then
              echo "Public asset verified: $asset_url"
              verified=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          if [ "$verified" != true ]; then
            echo "Release asset did not become publicly reachable: $asset_url" >&2
            exit 1
          fi
        done

  deploy-pages:
    runs-on: ubuntu-latest
    needs:
      - build-release
      - publish-release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  verify-release:
    runs-on: ubuntu-latest
    needs:
      - build-release
      - deploy-pages
    permissions:
      contents: read

    steps:
    - name: Checkout exact release tag
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.build-release.outputs.tag }}

    - name: Verify published App Installer feed
      shell: pwsh
      run: >
        ./scripts/release/verify-appinstaller-feed.ps1
        -AppInstallerUrl '${{ env.APPINSTALLER_URL }}'
        -ExpectedPackageVersion '${{ needs.build-release.outputs.version }}'
        -ExpectedPackageName N0ahTM.AudioPlaybackConnector2
        -ExpectedPublisher 'CN=AudioPlaybackConnector2'
        -ExpectedProcessorArchitecture x64
        -ExpectedPackageUri 'https://github.com/${{ github.repository }}/releases/download/${{ needs.build-release.outputs.tag }}/${{ needs.build-release.outputs.msix_name }}'
        -VerifyPackageUri
