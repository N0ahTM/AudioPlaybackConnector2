name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.2.3.
        required: true
        type: string
      store_only:
        description: Submit an already-published GitHub release only to Microsoft Store.
        required: false
        default: false
        type: boolean

concurrency:
  group: audioplaybackconnector2-production-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.version.outputs.source_ref }}
      semver: ${{ steps.version.outputs.semver }}
      tag: ${{ steps.version.outputs.tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    steps:
    - name: Checkout release tag
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        fetch-depth: 0

    - name: Validate tag and exact checkout
      id: version
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ inputs.tag }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
          $env:INPUT_TAG
        } else {
          $env:REF_NAME
        }
        Import-Module ./scripts/release/ReleaseVersion.psm1 -Force
        $version = Resolve-ReleaseVersion -Tag $tag
        $head = (git rev-parse HEAD).Trim()
        $tagCommit = (git rev-parse "$tag^{commit}").Trim()
        if ($head -ne $tagCommit) {
          throw "Checked out commit $head does not match $tag ($tagCommit)."
        }
        "source_ref=$tag" >> $env:GITHUB_OUTPUT
        "semver=$($version.SemVer)" >> $env:GITHUB_OUTPUT
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "package_version=$($version.PackageVersion)" >> $env:GITHUB_OUTPUT
        "commit_sha=$tagCommit" >> $env:GITHUB_OUTPUT

  build-artifacts:
    needs: version
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      source_ref: ${{ needs.version.outputs.source_ref }}
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}
      package_version: ${{ needs.version.outputs.package_version }}
      run_static_analysis: false
    secrets:
      SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

  create-draft:
    runs-on: ubuntu-24.04
    needs:
      - version
      - build-artifacts
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ needs.build-artifacts.outputs.artifact_name }}
        path: release-artifacts

    - name: Build release body
      shell: pwsh
      run: |
        $changelog = [IO.File]::ReadAllText('release-artifacts/RELEASE_NOTES.md').Trim()
        $footer = @'

        ---

        ## Installation

        **Recommended:** Install [AudioPlaybackConnector2 from the Microsoft Store](https://apps.microsoft.com/detail/9n366pgkjz0k) for a Microsoft-signed package and automatic updates.

        If the Store is unavailable, download `AudioPlaybackConnector2.cer`, trust it under **Trusted People**, and open `AudioPlaybackConnector2.appinstaller`. Windows App Installer selects x64 or ARM64 and follows this release channel for updates.

        `AudioPlaybackConnector2_${{ needs.version.outputs.package_version }}_x64_ARM64.msixbundle` is the manual fallback. Install the matching framework packages from `Dependencies` first. Direct bundle installation does not register automatic updates.

        You can also clone this tag and build the app yourself. See the [installation guide](https://github.com/N0ahTM/AudioPlaybackConnector2/blob/${{ needs.version.outputs.tag }}/docs/INSTALLATION.md) for all four paths.

        > GitHub packages use a self-signed identity that is separate from the Microsoft Store package. Never import the certificate into Trusted Root Certification Authorities.
        '@
        [IO.File]::WriteAllText('release-body.md', ($changelog + "`n" + $footer).Trim())

    - name: Create draft GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: v${{ needs.version.outputs.semver }}
        draft: true
        overwrite_files: true
        body_path: release-body.md
        files: |
          release-artifacts/*.msixbundle
          release-artifacts/*.appinstaller
          release-artifacts/*.cer
          release-artifacts/Dependencies/**/*.appx
          release-artifacts/Dependencies/**/*.msix
        fail_on_unmatched_files: true

  validate-promotion:
    runs-on: windows-2025-vs2026
    needs: version
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.store_only }}
    permissions:
      actions: read
      contents: read
    outputs:
      build_run_id: ${{ steps.build.outputs.RUN_ID }}
      artifact_digest: ${{ steps.build.outputs.ARTIFACT_DIGEST }}
      asset_fingerprint: ${{ steps.release.outputs.ASSET_FINGERPRINT }}
    steps:
    - name: Checkout exact release tag
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ needs.version.outputs.tag }}
        fetch-depth: 0

    - name: Locate successful immutable tag build
      id: build
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.version.outputs.tag }}
        EXPECTED_SHA: ${{ needs.version.outputs.commit_sha }}
        ARTIFACT_NAME: AudioPlaybackConnector2-release-${{ needs.version.outputs.package_version }}
      run: |
        $expectedSha = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
        if ($expectedSha -ne $env:EXPECTED_SHA) {
          throw "Checked out tag commit $expectedSha does not match validated commit $env:EXPECTED_SHA."
        }
        $endpoint = "repos/$env:GITHUB_REPOSITORY/actions/workflows/release.yml/runs"
        $response = gh api --method GET $endpoint -f event=push -f status=success -f per_page=100 | ConvertFrom-Json
        $runs = @($response.workflow_runs |
          Where-Object {
            $_.head_branch -eq $env:RELEASE_TAG -and
            $_.head_sha -eq $expectedSha -and
            $_.conclusion -eq 'success'
          } |
          Sort-Object run_number -Descending)
        if ($runs.Count -eq 0) {
          throw "No successful tag-push Release workflow exists for $env:RELEASE_TAG at $expectedSha."
        }

        $selectedRun = $null
        $selectedArtifact = $null
        foreach ($run in $runs) {
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts" | ConvertFrom-Json
          $matches = @($artifacts.artifacts | Where-Object { $_.name -eq $env:ARTIFACT_NAME -and -not $_.expired })
          if ($matches.Count -eq 1) {
            $selectedRun = $run
            $selectedArtifact = $matches[0]
            break
          }
        }
        if ($null -eq $selectedArtifact) {
          throw "No unexpired $env:ARTIFACT_NAME artifact belongs to a successful tag build."
        }
        if ([string]$selectedArtifact.digest -notmatch '^sha256:[0-9a-f]{64}$') {
          throw 'The immutable build artifact has no valid SHA-256 digest.'
        }
        "RUN_ID=$($selectedRun.id)" >> $env:GITHUB_OUTPUT
        "ARTIFACT_NAME=$($selectedArtifact.name)" >> $env:GITHUB_OUTPUT
        "ARTIFACT_DIGEST=$($selectedArtifact.digest)" >> $env:GITHUB_OUTPUT

    - name: Download immutable tag-build artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ steps.build.outputs.ARTIFACT_NAME }}
        path: release-artifacts
        repository: ${{ github.repository }}
        run-id: ${{ steps.build.outputs.RUN_ID }}
        github-token: ${{ github.token }}

    - name: Verify release assets against immutable build
      id: release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_RELEASE_STATE: ${{ inputs.store_only && 'Published' || 'Draft' }}
      run: |
        ./scripts/release/verify-release-promotion.ps1 `
          -Repository '${{ github.repository }}' `
          -Tag '${{ needs.version.outputs.tag }}' `
          -PackageVersion '${{ needs.version.outputs.package_version }}' `
          -ArtifactDirectory release-artifacts `
          -ExpectedReleaseState $env:EXPECTED_RELEASE_STATE `
          -WriteGitHubOutput

        $bundle = Get-Item 'release-artifacts/AudioPlaybackConnector2_${{ needs.version.outputs.package_version }}_x64_ARM64.msixbundle'
        $certificate = Get-Item 'release-artifacts/AudioPlaybackConnector2.cer'
        if ((Get-FileHash $certificate.FullName).Hash -ne (Get-FileHash 'certs/AudioPlaybackConnector2.cer').Hash) {
          throw 'Release certificate does not match the certificate in the tagged source.'
        }
        ./scripts/release/verify-msix-bundle.ps1 `
          -BundlePath $bundle.FullName `
          -ExpectedPackageVersion '${{ needs.version.outputs.package_version }}' `
          -ExpectedName N0ahTM.AudioPlaybackConnector2 `
          -ExpectedPublisher 'CN=AudioPlaybackConnector2' `
          -ExpectedProcessorArchitectures x64,arm64 `
          -ExpectedCertificatePath $certificate.FullName `
          -RequireSignature
        ./scripts/release/verify-dependency-packages.ps1 `
          -DependenciesDirectory release-artifacts/Dependencies `
          -ExpectedProcessorArchitectures x64,arm64

        @(
          '## Promotion verification',
          '',
          '- Tag commit: `${{ needs.version.outputs.commit_sha }}`',
          '- Tag-build run: `${{ steps.build.outputs.RUN_ID }}`',
          '- Immutable artifact digest: `${{ steps.build.outputs.ARTIFACT_DIGEST }}`',
          '- Every release asset matched its GitHub SHA-256 digest and build-artifact file.'
        ) -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  rebuild-store-upload:
    runs-on: windows-2025-vs2026
    needs: version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.store_only }}
    permissions:
      contents: read
    steps:
    - name: Checkout exact release tag
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ needs.version.outputs.tag }}
        fetch-depth: 0

    - name: Checkout current Store verification
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.sha }}
        path: store-automation

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          packages
          .nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config', '**/*.vcxproj', '**/*.wapproj', 'Directory.Build.props', 'AudioPlaybackConnector2.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet packages
      run: msbuild AudioPlaybackConnector2.slnx -t:restore -p:RestorePackagesConfig=true

    - name: Build Store-linked x64 and ARM64 upload package
      shell: pwsh
      run: |
        $manifestPath = Resolve-Path 'AudioPlaybackConnector2 (Package)/Package.appxmanifest'
        [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
        $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
        if ($null -eq $identity) { throw 'Package identity is missing from the release manifest.' }
        $identity.SetAttribute('Name', '12144NoahMeyer.AudioPlaybackConnector2')
        $identity.SetAttribute('Publisher', 'CN=3784F101-6355-463B-A35E-41BD0A95071B')
        $manifest.Save($manifestPath)

        $root = Join-Path $env:RUNNER_TEMP 'store-upload'
        & msbuild 'AudioPlaybackConnector2 (Package)\AudioPlaybackConnector2 (Package).wapproj' `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:ReleaseTag=${{ needs.version.outputs.tag }} `
          /p:PackageVersion=${{ needs.version.outputs.package_version }} `
          "/p:AppxPackageDir=$root\" `
          /p:AppxPackageSigningEnabled=false `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:GenerateAppxPackageOnBuild=true `
          /p:AppxBundle=Always `
          '/p:AppxBundlePlatforms=x64|ARM64' `
          /t:Rebuild
        if ($LASTEXITCODE -ne 0) { throw "Microsoft Store package build failed with exit code $LASTEXITCODE." }

    - name: Verify and stage Store upload package
      id: store-upload
      shell: pwsh
      run: |
        $uploads = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'store-upload') -Recurse -File -Filter '*.msixupload')
        if ($uploads.Count -ne 1) {
          throw "Expected exactly one .msixupload file, found $($uploads.Count)."
        }

        $extractRoot = Join-Path $env:RUNNER_TEMP 'store-upload-contents'
        [IO.Compression.ZipFile]::ExtractToDirectory($uploads[0].FullName, $extractRoot)
        $bundles = @(Get-ChildItem $extractRoot -Recurse -File -Filter '*.msixbundle')
        if ($bundles.Count -ne 1) {
          throw "Expected exactly one MSIX bundle inside the upload file, found $($bundles.Count)."
        }
        ./store-automation/scripts/release/verify-msix-bundle.ps1 `
          -BundlePath $bundles[0].FullName `
          -ExpectedPackageVersion '${{ needs.version.outputs.package_version }}' `
          -ExpectedName 12144NoahMeyer.AudioPlaybackConnector2 `
          -ExpectedPublisher 'CN=3784F101-6355-463B-A35E-41BD0A95071B' `
          -ExpectedProcessorArchitectures x64,arm64

        # Preserve the versioned package name. Partner Center can leave the
        # Version field empty while processing a new upload, so the filename is
        # the second independent signal used before certification is committed.
        $stagedUpload = Join-Path $env:RUNNER_TEMP $uploads[0].Name
        Copy-Item -LiteralPath $uploads[0].FullName -Destination $stagedUpload
        "PATH=$stagedUpload" >> $env:GITHUB_OUTPUT

    - name: Upload verified Store package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: AudioPlaybackConnector2-store-${{ needs.version.outputs.package_version }}
        path: ${{ steps.store-upload.outputs.PATH }}
        if-no-files-found: error
        retention-days: 30

  publish-release:
    runs-on: ubuntu-24.04
    needs:
      - version
      - validate-promotion
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.store_only }}
    permissions:
      contents: write
    environment:
      name: production-release
    steps:
    - name: Checkout exact release tag
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ needs.version.outputs.tag }}
        fetch-depth: 0

    - name: Recheck assets and publish GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./scripts/release/verify-release-promotion.ps1 `
          -Repository '${{ github.repository }}' `
          -Tag '${{ needs.version.outputs.tag }}' `
          -PackageVersion '${{ needs.version.outputs.package_version }}' `
          -ExpectedReleaseState Draft `
          -ExpectedAssetFingerprint '${{ needs.validate-promotion.outputs.asset_fingerprint }}'
        gh release edit '${{ needs.version.outputs.tag }}' --repo '${{ github.repository }}' --draft=false

  verify-public-release:
    runs-on: ubuntu-24.04
    needs:
      - version
      - publish-release
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.store_only || needs.publish-release.result == 'success') }}
    permissions:
      contents: read
    steps:

    - name: Verify public release assets
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $release = gh release view '${{ needs.version.outputs.tag }}' --repo '${{ github.repository }}' --json assets,isDraft,isPrerelease | ConvertFrom-Json
        if ($release.isDraft -or $release.isPrerelease) {
          throw 'Release is not public and stable.'
        }
        $required = @(
          'AudioPlaybackConnector2_${{ needs.version.outputs.package_version }}_x64_ARM64.msixbundle',
          'AudioPlaybackConnector2.appinstaller',
          'AudioPlaybackConnector2.cer'
        )
        $publishedNames = @($release.assets | ForEach-Object name)
        foreach ($name in $required) {
          if ($publishedNames -notcontains $name) { throw "Required release asset is missing: $name" }
        }
        foreach ($asset in $release.assets) {
          $reachable = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              Invoke-WebRequest -Uri $asset.url -Method Head -TimeoutSec 30 -ErrorAction Stop | Out-Null
              $reachable = $true
              break
            } catch {
              if ($attempt -eq 6) { throw }
              Start-Sleep -Seconds 10
            }
          }
          if (-not $reachable) { throw "Release asset is not publicly reachable: $($asset.name)" }
        }

  deploy-appinstaller:
    needs:
      - version
      - verify-public-release
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.store_only }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-appinstaller.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      package_version: ${{ needs.version.outputs.package_version }}

  publish-microsoft-store:
    runs-on: windows-2022
    needs:
      - version
      - validate-promotion
      - deploy-appinstaller
      - rebuild-store-upload
      - verify-public-release
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.store_only || needs.validate-promotion.result == 'success') && needs.verify-public-release.result == 'success' && ((inputs.store_only && needs.rebuild-store-upload.result == 'success') || (!inputs.store_only && needs.deploy-appinstaller.result == 'success')) }}
    permissions:
      actions: read
      contents: read
    environment:
      name: production-release
    steps:
    - name: Checkout exact release tag
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ needs.version.outputs.tag }}
        fetch-depth: 0

    - name: Checkout current Store automation
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.sha }}
        path: store-automation

    - name: Download immutable release artifact
      if: ${{ !inputs.store_only }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: AudioPlaybackConnector2-release-${{ needs.version.outputs.package_version }}
        path: release-artifacts
        repository: ${{ github.repository }}
        run-id: ${{ needs.validate-promotion.outputs.build_run_id }}
        github-token: ${{ github.token }}

    - name: Download rebuilt Store artifact
      if: ${{ inputs.store_only }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: AudioPlaybackConnector2-store-${{ needs.version.outputs.package_version }}
        path: release-artifacts

    - name: Verify Microsoft Store upload package
      id: store-package
      shell: pwsh
      run: |
        $uploads = @(Get-ChildItem release-artifacts -Recurse -File -Filter '*.msixupload')
        if ($uploads.Count -ne 1) {
          throw "Expected exactly one .msixupload file, found $($uploads.Count)."
        }

        $extractRoot = Join-Path $env:RUNNER_TEMP 'store-upload-contents'
        [IO.Compression.ZipFile]::ExtractToDirectory($uploads[0].FullName, $extractRoot)
        $bundles = @(Get-ChildItem $extractRoot -Recurse -File -Filter '*.msixbundle')
        if ($bundles.Count -ne 1) {
          throw "Expected exactly one MSIX bundle inside the upload file, found $($bundles.Count)."
        }
        ./scripts/release/verify-msix-bundle.ps1 `
          -BundlePath $bundles[0].FullName `
          -ExpectedPackageVersion '${{ needs.version.outputs.package_version }}' `
          -ExpectedName 12144NoahMeyer.AudioPlaybackConnector2 `
          -ExpectedPublisher 'CN=3784F101-6355-463B-A35E-41BD0A95071B' `
          -ExpectedProcessorArchitectures x64,arm64

        "PATH=$($uploads[0].FullName)" >> $env:GITHUB_OUTPUT

    - name: Set up Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      with:
        version: v0.4.2

    - name: Authenticate with Partner Center
      shell: pwsh
      env:
        TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        SELLER_ID: ${{ secrets.SELLER_ID }}
        CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      run: |
        msstore reconfigure `
          --tenantId $env:TENANT_ID `
          --sellerId $env:SELLER_ID `
          --clientId $env:CLIENT_ID `
          --clientSecret $env:CLIENT_SECRET
        if ($LASTEXITCODE -ne 0) {
          throw "Microsoft Store authentication failed with exit code $LASTEXITCODE."
        }

    - name: Submit package and localized release notes to Microsoft Store certification
      shell: pwsh
      env:
        AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        SELLER_ID: ${{ secrets.SELLER_ID }}
        AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      run: |
        ./store-automation/scripts/release/publish-microsoft-store.ps1 `
          -ProductId 9N366PGKJZ0K `
          -PackagePath '${{ steps.store-package.outputs.PATH }}' `
          -Version '${{ needs.version.outputs.semver }}' `
          -WhatsNewPath './store/whats-new.json'

        @(
          '## Microsoft Store submission',
          '',
          '- Product: `9N366PGKJZ0K`',
          '- Package version: `${{ needs.version.outputs.package_version }}`',
          '- The package was submitted to Microsoft certification.'
        ) -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  rollback-release:
    runs-on: ubuntu-24.04
    needs:
      - version
      - publish-release
      - verify-public-release
      - deploy-appinstaller
    if: ${{ always() && !inputs.store_only && needs.publish-release.result == 'success' && (needs.verify-public-release.result != 'success' || needs.deploy-appinstaller.result != 'success') }}
    permissions:
      contents: write
    steps:
    - name: Return GitHub Release to draft
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release edit '${{ needs.version.outputs.tag }}' --repo '${{ github.repository }}' --draft=true
        test "$(gh release view '${{ needs.version.outputs.tag }}' --repo '${{ github.repository }}' --json isDraft --jq .isDraft)" = true
