name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      semver:
        description: Release version to dry-run, for example 1.2.3.
        required: true
        type: string

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      tag: ${{ steps.version.outputs.tag }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
    - name: Validate version
      id: version
      shell: pwsh
      env:
        INPUT_SEMVER: ${{ inputs.semver }}
      run: |
        $semver = $env:INPUT_SEMVER
        if ($semver -notmatch '^\d+\.\d+\.\d+$') {
          throw 'Version must look like 1.2.3.'
        }
        foreach ($part in $semver.Split('.')) {
          [uint64]$component = 0
          if (-not [uint64]::TryParse($part, [ref]$component) -or $component -gt [uint16]::MaxValue) {
            throw 'Version contains an invalid MSIX component.'
          }
        }
        "semver=$semver" >> $env:GITHUB_OUTPUT
        "tag=v$semver" >> $env:GITHUB_OUTPUT
        "package_version=$semver.0" >> $env:GITHUB_OUTPUT

  build-artifacts:
    needs: version
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      source_ref: ${{ github.sha }}
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}
      package_version: ${{ needs.version.outputs.package_version }}
      run_static_analysis: true
    secrets:
      SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

  report:
    runs-on: ubuntu-24.04
    needs:
      - version
      - build-artifacts
    permissions:
      contents: read
    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ needs.build-artifacts.outputs.artifact_name }}
        path: release-artifacts

    - name: Report artifact sizes
      shell: pwsh
      run: |
        $files = Get-ChildItem release-artifacts -Recurse -File | Sort-Object FullName
        $summary = @(
          '## Release dry run v${{ needs.version.outputs.semver }}',
          '',
          '| File | Bytes | MiB |',
          '| --- | ---: | ---: |'
        )
        foreach ($file in $files) {
          $relative = [IO.Path]::GetRelativePath((Resolve-Path release-artifacts), $file.FullName)
          $summary += "| $relative | $($file.Length) | $([math]::Round($file.Length / 1MB, 2)) |"
        }
        $summary -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
