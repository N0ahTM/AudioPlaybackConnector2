name: Deploy App Installer Feed

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      package_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag that contains the MSIX bundle.
        required: true
        type: string
      package_version:
        description: Four-part MSIX package version, for example 1.2.3.0.
        required: true
        type: string

env:
  APPINSTALLER_URL: https://n0ahtm.github.io/AudioPlaybackConnector2/AudioPlaybackConnector2.appinstaller

concurrency:
  group: audioplaybackconnector2-appinstaller-feed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout exact release tag
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0

    - name: Validate release inputs
      shell: pwsh
      run: |
        if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
          throw 'Release tag must look like v1.2.3.'
        }
        if ($env:PACKAGE_VERSION -ne ($env:RELEASE_TAG.TrimStart('v') + '.0')) {
          throw 'Package version does not match the release tag.'
        }
        foreach ($part in $env:PACKAGE_VERSION.Split('.')) {
          [uint64]$component = 0
          if (-not [uint64]::TryParse($part, [ref]$component) -or $component -gt [uint16]::MaxValue) {
            throw 'Package version contains an invalid component.'
          }
        }
        $head = (git rev-parse HEAD).Trim()
        $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
        if ($head -ne $tagCommit) {
          throw "Checked out commit $head does not match $env:RELEASE_TAG ($tagCommit)."
        }

    - name: Download and verify release bundle
      id: bundle
      shell: pwsh
      run: |
        $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
        if ($release.isDraft -or $release.isPrerelease) {
          throw 'The App Installer feed may reference only a published, non-prerelease GitHub Release.'
        }
        $packageDir = Join-Path $env:RUNNER_TEMP 'package'
        New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $packageDir `
          --pattern 'AudioPlaybackConnector2_*_x64_ARM64.msixbundle' --clobber
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $packageDir `
          --pattern 'AudioPlaybackConnector2.cer' --clobber
        $bundles = @(Get-ChildItem -Path $packageDir -Filter '*.msixbundle' -File)
        $certificates = @(Get-ChildItem -Path $packageDir -Filter '*.cer' -File)
        if ($bundles.Count -ne 1) { throw "Expected one x64/ARM64 MSIX bundle, found $($bundles.Count)." }
        if ($certificates.Count -ne 1) { throw "Expected one certificate, found $($certificates.Count)." }
        if ((Get-FileHash $certificates[0].FullName).Hash -ne (Get-FileHash 'certs/AudioPlaybackConnector2.cer').Hash) {
          throw 'Published certificate does not match the certificate in the tagged source.'
        }
        ./scripts/release/verify-msix-bundle.ps1 `
          -BundlePath $bundles[0].FullName `
          -ExpectedPackageVersion $env:PACKAGE_VERSION `
          -ExpectedName N0ahTM.AudioPlaybackConnector2 `
          -ExpectedPublisher 'CN=AudioPlaybackConnector2' `
          -ExpectedProcessorArchitectures x64,arm64 `
          -ExpectedCertificatePath $certificates[0].FullName `
          -RequireSignature
        "PATH=$($bundles[0].FullName)" >> $env:GITHUB_OUTPUT
        "NAME=$($bundles[0].Name)" >> $env:GITHUB_OUTPUT

    - name: Download and verify release dependencies
      id: dependencies
      shell: pwsh
      run: |
        $dependencies = Join-Path $env:RUNNER_TEMP 'dependencies'
        New-Item -ItemType Directory -Path $dependencies -Force | Out-Null
        gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $dependencies `
          --pattern '*.appx' --pattern '*.msix' --clobber
        $packages = @(Get-ChildItem -Path $dependencies -File)
        if ($packages.Count -gt 0) {
          ./scripts/release/verify-dependency-packages.ps1 `
            -DependenciesDirectory $dependencies `
            -ExpectedProcessorArchitectures x64,arm64
        } else {
          Write-Warning 'No dependency packages were published with the release.'
        }
        "DIR=$dependencies" >> $env:GITHUB_OUTPUT

    - name: Generate App Installer feed
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path pages -Force | Out-Null
        $params = @{
          PackageUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$env:BUNDLE_NAME"
          AppInstallerUrl = $env:APPINSTALLER_URL
          PackagePath = $env:BUNDLE_PATH
          OutputPath = 'pages/AudioPlaybackConnector2.appinstaller'
          ExpectedPackageVersion = $env:PACKAGE_VERSION
        }
        $dependencies = '${{ steps.dependencies.outputs.DIR }}'
        if ((Get-ChildItem -Path $dependencies -File -ErrorAction SilentlyContinue).Count -gt 0) {
          $params.DependenciesDirectory = $dependencies
          $params.DependencyBaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
        }
        ./scripts/release/generate-appinstaller.ps1 @params
      env:
        BUNDLE_NAME: ${{ steps.bundle.outputs.NAME }}
        BUNDLE_PATH: ${{ steps.bundle.outputs.PATH }}

    - name: Back up current feed and reject downgrades
      id: feed-backup
      shell: pwsh
      run: |
        $rollbackDir = Join-Path $env:RUNNER_TEMP 'pages-rollback'
        $backupPath = Join-Path $rollbackDir 'AudioPlaybackConnector2.appinstaller'
        $packageUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$env:BUNDLE_NAME"
        ./scripts/release/assert-appinstaller-monotonic.ps1 `
          -AppInstallerUrl $env:APPINSTALLER_URL `
          -CandidateVersion $env:PACKAGE_VERSION `
          -CandidatePackageUri $packageUri `
          -CandidatePackageName N0ahTM.AudioPlaybackConnector2 `
          -CandidatePublisher 'CN=AudioPlaybackConnector2' `
          -BackupPath $backupPath
        if (Test-Path -LiteralPath $backupPath) {
          "EXISTS=true" >> $env:GITHUB_OUTPUT
          "SHA256=$((Get-FileHash -LiteralPath $backupPath -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
        } else {
          New-Item -ItemType Directory -Path $rollbackDir -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $rollbackDir 'index.html'), 'No App Installer feed is currently published.')
          "EXISTS=false" >> $env:GITHUB_OUTPUT
          "SHA256=" >> $env:GITHUB_OUTPUT
        }
      env:
        BUNDLE_NAME: ${{ steps.bundle.outputs.NAME }}

    - name: Configure GitHub Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

    - name: Upload GitHub Pages candidate
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        name: github-pages-candidate
        path: pages

    - name: Upload GitHub Pages rollback
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        name: github-pages-rollback
        path: ${{ runner.temp }}/pages-rollback

    - name: Mark deployment attempt
      id: deployment-attempt
      run: echo "App Installer deployment is starting."

    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      with:
        artifact_name: github-pages-candidate

    - name: Verify published App Installer feed
      shell: pwsh
      run: >
        ./scripts/release/verify-appinstaller-feed.ps1
        -AppInstallerUrl '${{ env.APPINSTALLER_URL }}'
        -ExpectedPackageVersion $env:PACKAGE_VERSION
        -ExpectedPackageName N0ahTM.AudioPlaybackConnector2
        -ExpectedPublisher 'CN=AudioPlaybackConnector2'
        -ExpectedPackageUri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/${{ steps.bundle.outputs.NAME }}"
        -VerifyPackageUri

    - name: Return release to draft after deployment failure
      if: ${{ failure() && steps.deployment-attempt.outcome == 'success' }}
      shell: pwsh
      run: |
        gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=true
        $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
        if (-not $release.isDraft) { throw 'Release did not return to draft state.' }

    - name: Restore previous GitHub Pages feed
      id: rollback-deployment
      if: ${{ failure() && steps.deployment-attempt.outcome == 'success' }}
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      with:
        artifact_name: github-pages-rollback

    - name: Verify restored App Installer feed
      if: ${{ failure() && steps.deployment-attempt.outcome == 'success' && steps.rollback-deployment.outcome == 'success' }}
      shell: pwsh
      run: |
        $hadFeed = '${{ steps.feed-backup.outputs.EXISTS }}' -eq 'true'
        $expectedHash = '${{ steps.feed-backup.outputs.SHA256 }}'
        $downloadPath = Join-Path $env:RUNNER_TEMP 'restored.appinstaller'
        for ($attempt = 1; $attempt -le 6; $attempt++) {
          try {
            Invoke-WebRequest -Uri $env:APPINSTALLER_URL -OutFile $downloadPath -TimeoutSec 30 -ErrorAction Stop
            if (-not $hadFeed) { throw 'The feed still exists although no previous feed was available.' }
            $actualHash = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) { throw "Restored feed hash $actualHash does not match $expectedHash." }
            exit 0
          } catch {
            $statusCode = if ($null -ne $_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if (-not $hadFeed -and $statusCode -eq 404) { exit 0 }
            if ($attempt -eq 6) { throw }
            Start-Sleep -Seconds 10
          }
        }
